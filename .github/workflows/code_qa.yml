name: "Code QA: Mypy & Ruff"
run-name: "Code QA on ${{ github.ref }} by ${{ github.actor }}"

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
    code_qa:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repository
          uses: actions/checkout@v3

        - name: Install uv
          uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
          with:
            version: "0.13.9"

        - name: Set up Python 
          run: uv python install

        - name: Install dependencies
          run: uv sync --locked --all-extras --dev

        - name: Ruff
          run: |
            uv run ruff check ./shawarma_mlops | python3 .github/workflows/mypy_ruff_filtering.py --ruff-output

        - name: Mypy
          run: |
            uv run mypy --strict ./shawarma_mlops | python3 .github/workflows/mypy_ruff_filtering.py --mypy-output

