[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "shawarma_mlops"
version = "0.0.1"
description = "CookieCutter template for the final project in the MLOps course"
authors = [
  { name = "LeBabOps" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.13.0"
dependencies = [
    "loguru>=0.8.0",
    "mkdocs>=1.6.1",
    "mypy>=2.4.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.5",
    "tqdm>=4.70.1",
    "typer>=0.29.1",
    "types-tqdm>=4.70.0.20261106",
]


[tool.ruff]
line-length = 120
src = ["shawarma_mlops"]
include = ["pyproject.toml", "shawarma_mlops/**/*.py"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.isort]
known-first-party = ["shawarma_mlops"]
force-sort-within-sections = true

[tool.mypy]
strict = true

