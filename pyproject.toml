[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "shawarma_mlops"
version = "0.0.1"
description = "CookieCutter template for the final project in the MLOps course"
authors = [
  { name = "LeBabOps" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 99
src = ["shawarma_mlops"]
include = ["pyproject.toml", "shawarma_mlops/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["shawarma_mlops"]
force-sort-within-sections = true

